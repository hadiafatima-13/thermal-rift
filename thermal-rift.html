<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Thermal Rift: The Lost City</title>
<style>
:root{--bg:#070a18;--fg:#e8f0ff;--ac:#5ef0ff;--pn:rgba(12,18,40,.94);--ln:#2b3a6b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,sans-serif;touch-action:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;display:flex;align-items:center;gap:8px;padding:8px;flex-wrap:wrap;pointer-events:none;text-shadow:0 1px 3px #000}#hud button{pointer-events:auto}
.pip{display:inline-block;width:24px;height:24px;line-height:24px;text-align:center;border-radius:50%;border:2px solid var(--c);margin:0 3px;opacity:.6}.pip.d{background:var(--c);color:#000;opacity:1}
.b{background:#16224a;color:var(--fg);border:1px solid var(--ln);border-radius:10px;padding:9px 12px;font:inherit;cursor:pointer;margin:3px}.b:hover{border-color:var(--ac)}.b.on{background:#0f5c68;border-color:var(--ac)}
.bar{height:12px;background:#0b1230;border-radius:6px;overflow:hidden;border:1px solid var(--ln);margin:4px 0}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff7a3d,#ffd25e)}
#ht{position:fixed;bottom:calc(90px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;pointer-events:none;text-shadow:0 1px 4px #000;font-weight:600}
#ts{position:fixed;top:64px;left:50%;transform:translateX(-50%);background:var(--pn);border:1px solid var(--ac);padding:8px 14px;border-radius:10px;opacity:0;transition:opacity .4s;pointer-events:none;max-width:90vw;text-align:center}
#pn{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(94vw,580px);max-height:84vh;overflow:auto;background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:14px;display:none;z-index:4;touch-action:pan-y}
#pn h3{margin:0 0 6px}#pn p{margin:6px 0}.box{background:#0a1030;border:1px solid var(--ln);border-radius:8px;padding:8px;margin:6px 0}
#ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(3,5,15,.8);z-index:6}.card{background:var(--pn);border:1px solid var(--ac);border-radius:14px;padding:20px;width:min(92vw,520px);max-height:86vh;overflow:auto;touch-action:pan-y}
#joy,.tb{display:none;position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:3}#joy{left:16px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.3)}
#kn{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:rgba(94,240,255,.6)}.tb{right:16px;width:64px;height:64px;border-radius:50%;border:2px solid var(--ac);background:rgba(20,40,80,.7);color:#fff;font:bold 20px sans-serif}#bJ{right:96px}
@media (pointer:coarse){#joy,.tb{display:block}}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud"><b>Thermal Rift</b><span id="pips"></span><span id="obj"></span><span style="flex:1"></span><button class="b" id="bj">📖 Journal</button><button class="b" id="bp">⏸</button><button class="b" id="bsn">🔊</button></div>
<div id="ht"></div><div id="ts"></div><div id="pn"></div><div id="ov"></div>
<div id="joy"><i id="kn"></i></div><button class="tb" id="bJ">⤒</button><button class="tb" id="bE">E</button>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id),T=THREE,H=(id,t)=>{const e=$(id);if(e)e.innerHTML=t},W=(id,p)=>{const e=$(id);if(e)e.style.width=Math.max(0,Math.min(100,p))+'%'};
let save={done:[],j:[],cp:null};try{const s=JSON.parse(localStorage.getItem('tr3'));if(s)save=s}catch(e){}
const persist=()=>{try{localStorage.setItem('tr3',JSON.stringify(save))}catch(e){}};
let AC,snd=true,paused=1,openIdx=-1;
function beep(f=600,d=.12,ty='sine'){if(!snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(.05,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function toast(t){const e=$('ts');e.textContent=t;e.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.opacity=0,3000)}
const jn=t=>{if(!save.j.includes(t)){save.j.push(t);persist()}};
/* ---------- 3D setup ---------- */
const R=new T.WebGLRenderer({canvas:$('c'),antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,1.5));
const sc=new T.Scene();sc.background=new T.Color(0x070a18);sc.fog=new T.FogExp2(0x070a18,.016);
const cam=new T.PerspectiveCamera(65,1,.1,150);
function rs(){R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}addEventListener('resize',rs);rs();
const hemi=new T.HemisphereLight(0x8fb0ff,0x201030,.6);sc.add(hemi);const sun=new T.DirectionalLight(0xffffff,.5);sun.position.set(5,20,8);sc.add(sun);
const mk=(g,c,e=0,o={})=>new T.Mesh(g,new T.MeshStandardMaterial(Object.assign({color:c,emissive:c,emissiveIntensity:e,roughness:.6,metalness:.2},o)));
const fl=mk(new T.CircleGeometry(42,48),0x141a33);fl.rotation.x=-Math.PI/2;sc.add(fl);
const CR=[];for(let i=0;i<70;i++){const a=Math.random()*6.283,r=30+Math.random()*10,h=3+Math.random()*8;const c=mk(new T.ConeGeometry(.8+Math.random(),h,5),new T.Color().setHSL(.5+Math.random()*.25,.8,.5).getHex(),.6,{transparent:true,opacity:.85});c.position.set(Math.cos(a)*r,h/2,Math.sin(a)*r);c.rotation.z=(Math.random()-.5)*.4;sc.add(c);CR.push(c)}
const BL=[];for(let i=0;i<16;i++){const a=i*.3927+.2,h=3+Math.random()*4;const b=mk(new T.BoxGeometry(2.2,h,2.2),0x2a3357,.05);b.position.set(Math.cos(a)*24,h/2,Math.sin(a)*24);sc.add(b);BL.push(b)}
function Flow(color,a,b,par){const g=new T.Group(),p=[];for(let i=0;i<10;i++){const m=mk(new T.SphereGeometry(.12,8,6),color,1.2);g.add(m);p.push(m)}par.add(g);return{on:0,upd(t){p.forEach((m,i)=>{m.visible=this.on>0;const u=(t*.5+i/10)%1;m.position.lerpVectors(a,b,u);m.position.y+=Math.sin(u*3.14)*1.2})}}}
/* ---------- state ---------- */
const e0={c:'none',run:0,sys:100,warm:0,flow:0},e1={hold:0,prog:0,cold:0,flow:0},e2={b1:0,b2:0,f1:0,f2:0,flash:0},e3={mode:'exo',cat:0,m:0,x:0,roll:0,wait:0,seen:{},hold:0},e4={o2:1,g:6,L:0,seen:{},glow:0};
const RG={exo:{R:50,P:20,pk:[110,80]},endo:{R:20,P:50,pk:[90,60]}};
const CC={};function curve(m,c){const k=m+c;if(CC[k])return CC[k];const d=RG[m],pk=d.pk[c],bs=x=>d.R+(d.P-d.R)*x*x*(3-2*x),bp=x=>Math.exp(-(((x-.4)/.16)**2));let A=pk-d.R;for(let n=0;n<8;n++){let mx=-1e9;for(let s=0;s<=200;s++)mx=Math.max(mx,bs(s/200)+A*bp(s/200));A+=pk-mx}const a=[];for(let s=0;s<=200;s++)a.push(bs(s/200)+A*bp(s/200));return CC[k]=a}
/* ---------- stations ---------- */
function b0(g){const ch=mk(new T.CylinderGeometry(.9,.9,1.8,20),0xff7a3d,.5);ch.position.set(-2.5,1.3,0);g.add(ch);
const pv=new T.Group();pv.position.set(0,.5,0);const br=mk(new T.BoxGeometry(5,.25,2.2),0x4477ff,.4);br.position.x=2.5;pv.add(br);g.add(pv);
const f=Flow(0xffaa44,new T.Vector3(-1.6,1.5,0),new T.Vector3(3,.9,0),g),cold=new T.Color(0x4477ff),hot=new T.Color(0xff7733);
return t=>{pv.scale.x=.15+.85*e0.warm;br.material.color.copy(cold).lerp(hot,e0.warm);br.material.emissive.copy(br.material.color);ch.material.emissiveIntensity=.2+e0.sys/100*.8;f.on=e0.flow;f.upd(t)}}
function b1(g){const ch=mk(new T.CylinderGeometry(.9,.9,1.8,20),0x33ccff,.5);ch.position.set(-2.5,1.3,0);g.add(ch);
const w=mk(new T.BoxGeometry(6,.3,3),0x2255cc,.4);w.position.set(2,.55,0);g.add(w);const ic=mk(new T.BoxGeometry(6,.3,3),0xdff6ff,.5,{transparent:true,opacity:.9});g.add(ic);
const f=Flow(0x66ddff,new T.Vector3(2,1.2,0),new T.Vector3(-1.6,1.5,0),g),c1=new T.Color(0x2255cc),c2=new T.Color(0x99ddff);
return t=>{ic.visible=e1.cold>.02;ic.scale.y=e1.cold*2+.01;ic.position.set(2,.7+.15*ic.scale.y,0);w.material.color.copy(c1).lerp(c2,e1.cold);w.material.emissive.copy(w.material.color);ch.material.emissiveIntensity=.2+e1.prog/100*.8;f.on=e1.flow;f.upd(t)}}
const AP=[[[-1,-.6],[-.45,-.6],[.3,.6],[1.1,.6]],[[-1.4,-.9],[-.3,-.9],[.3,.9],[1.4,.9]],[[-1.4,0],[.6,0],[-.75,0],[1.25,0]]];
function tg(i){const H1=i%2,Cl=i>1,f=e2[i==0||i==2?'f1':'f2'],b=e2[Cl?'b2':'b1'];return AP[f?2:b?1:0][i]}
function b2(g){const tb=mk(new T.BoxGeometry(5.6,.2,3.4),0x33406e,.1);tb.position.y=1;g.add(tb);
const A=[0,1,2,3].map(i=>{const a=mk(new T.SphereGeometry(i<2?.32:.5,16,12),i<2?0xffffff:0x44ff88,.4);a.position.set(0,1.7,0);g.add(a);return a});
return t=>{A.forEach((a,i)=>{const p=tg(i);a.position.x+=(p[0]*1.3-a.position.x)*.08;a.position.z+=(p[1]*1.3-a.position.z)*.08;a.position.y=1.7+Math.sin(t*2+i)*.06+e2.flash*.3;a.material.emissiveIntensity=.4+e2.flash*1.5})}}
function b3(g){const N=41,u=[],c=[];for(let i=0;i<N;i++){const a=mk(new T.BoxGeometry(.22,.22,.22),0xff9a4d,1),b=mk(new T.BoxGeometry(.2,.2,.2),0x5eff9a,1);g.add(a,b);u.push(a);c.push(b)}
const ball=mk(new T.SphereGeometry(.35,16,12),0xffffff,.8);g.add(ball);
return t=>{const A=curve(e3.mode,0),B=curve(e3.mode,1);for(let i=0;i<N;i++){const s=Math.round(i/(N-1)*200),x=-4+8*i/(N-1);u[i].position.set(x,.5+A[s]/25,-.6);c[i].position.set(x,.5+B[s]/25,.6);c[i].visible=!!e3.cat}
const s=Math.round(e3.x*200);ball.position.set(-4+8*e3.x,.85+curve(e3.mode,e3.cat)[s]/25,e3.cat?.6:-.6)}}
function b4(g){const dm=mk(new T.SphereGeometry(4.8,24,12,0,6.283,0,1.5708),0x66ffaa,.15,{transparent:true,opacity:.18,side:T.DoubleSide});g.add(dm);
for(let i=0;i<7;i++){const p=mk(new T.ConeGeometry(.5,1.8,6),0x33cc55,.3),a=i*.9;p.position.set(Math.cos(a)*3.4,1,Math.sin(a)*3.4);g.add(p)}
const cell=mk(new T.SphereGeometry(1.1,20,14),0xffd25e,.3,{transparent:true,opacity:.7});cell.position.y=2;g.add(cell);const nu=mk(new T.SphereGeometry(.4,12,8),0xff6688,.5);nu.position.set(.2,2.1,.2);g.add(nu);
const lp=[];for(let i=0;i<6;i++){const l=mk(new T.SphereGeometry(.25,10,8),0xffee55,.8);l.position.set(-1.5+i*.6,.7,2.6);g.add(l);lp.push(l)}
return t=>{cell.rotation.y=t;cell.scale.setScalar(1+.05*Math.sin(t*4)*(.3+e4.glow));cell.material.emissiveIntensity=.3+e4.glow*1.5;lp.forEach((l,i)=>l.visible=i<e4.L)}}
const ST=[{n:'Exothermic Engine',c:0xff7a3d,b:b0},{n:'Frozen Canal',c:0x33ccff,b:b1},{n:'Bond Workbench',c:0x44ff88,b:b2},{n:'Barrier Landscape',c:0xb07bff,b:b3},{n:'Greenhouse',c:0xffd25e,b:b4}];
ST.forEach((s,i)=>{const a=i*1.2566-1.57;s.p=new T.Vector3(Math.cos(a)*15,0,Math.sin(a)*15);s.g=new T.Group();s.g.position.copy(s.p);sc.add(s.g);
const pl=mk(new T.CylinderGeometry(5.5,5.8,.2,32),0x1d2750);pl.position.y=.1;s.g.add(pl);
s.bc=mk(new T.CylinderGeometry(.15,.15,16,8),s.c,1,{transparent:true,opacity:.5});s.bc.position.y=8;s.g.add(s.bc);
s.l=new T.PointLight(s.c,.3,24);s.l.position.set(0,5,0);s.g.add(s.l);s.u=s.b(s.g)});
/* player */
const pl=new T.Group(),pp=new T.Vector3(0,0,0);
[[new T.CylinderGeometry(.35,.4,1,12),0x2c7fff,.2,0,.9,0],[new T.SphereGeometry(.32,14,10),0xffe0c0,0,0,1.65,0],[new T.BoxGeometry(.4,.14,.2),0x5ef0ff,1.5,0,1.68,.25],[new T.BoxGeometry(.5,.6,.25),0xff9b3d,.3,0,1,-.4]].forEach(a=>{const m=mk(a[0],a[1],a[2]);m.position.set(a[3],a[4],a[5]);pl.add(m)});sc.add(pl);
const CF=[];function boom(){const g=new T.SphereGeometry(.15,6,4);for(let i=0;i<90;i++){const m=mk(g,new T.Color().setHSL(Math.random(),1,.6).getHex(),1.5);m.position.set(0,3,0);m.v=new T.Vector3((Math.random()-.5)*14,8+Math.random()*10,(Math.random()-.5)*14);m.life=4;sc.add(m);CF.push(m)}}
/* ---------- UI helpers ---------- */
function ov(h){$('ov').innerHTML='<div class="card">'+h+'</div>';$('ov').style.display='flex';paused=1}
function cov(){$('ov').style.display='none';paused=0}
function hud(){$('pips').innerHTML=ST.map((s,i)=>`<span class="pip${save.done.includes(i)?' d':''}" style="--c:#${s.c.toString(16).padStart(6,'0')}" title="${s.n}">${i+1}</span>`).join('');const n=ST.findIndex((s,i)=>!save.done.includes(i));$('obj').textContent=n<0?'City restored!':'Go to: '+ST[n].n}
const FJ=['Exothermic: products have less energy than reactants, so energy is released to the surroundings (bridge warms). ΔH < 0, e.g. CH₄ burning ΔH = −890 kJ mol⁻¹.','Endothermic: energy is absorbed from the surroundings (canal cools) and must keep being supplied. Products have more energy. ΔH > 0, e.g. NH₄NO₃ dissolving ≈ +26 kJ mol⁻¹.','H₂ + Cl₂ → 2HCl: ΔH = energy to break bonds − energy released forming bonds = (436 + 243) − (2 × 432) = −185 kJ mol⁻¹.','A catalyst gives a lower-energy route (lower activation energy). ΔH stays the same and the catalyst is not used up.','Aerobic respiration releases much more energy per glucose (~30 units) than anaerobic (~2). Lipids are a reserve energy store from nutrients, drawn on later (with oxygen).'];
function fin(i){if(save.done.includes(i))return;save.done.push(i);save.cp=i;jn(FJ[i]);persist();hud();toast('✔ '+ST[i].n+' restored — checkpoint saved');beep(700,.15);setTimeout(()=>beep(900,.2),150);setTimeout(()=>beep(1200,.3),320);if(save.done.length===5)setTimeout(end,2800)}
function end(){closeP();boom();ov(`<h2>🌟 The Lost City is alive!</h2><p>All five engines are running. What you discovered:</p><ul>${FJ.map(t=>'<li>'+t+'</li>').join('')}</ul><button class="b" id="ex">Explore the city</button><button class="b" id="rp">Play again</button>`);$('ex').onclick=cov;$('rp').onclick=()=>{save={done:[],j:[],cp:null};persist();location.reload()}}
function jrn(){ov(`<h2>📖 Mission journal</h2>${save.j.length?'<ul>'+save.j.map(t=>'<li>'+t+'</li>').join('')+'</ul>':'<p>Nothing recorded yet. Restore an engine to make your first discovery.</p>'}<button class="b" id="cv">Close</button>`);$('cv').onclick=cov}
function pause(){ov(`<h2>Paused</h2><button class="b" id="r1">Resume</button><button class="b" id="r2">Return to checkpoint</button><button class="b" id="r3">Restart game</button>`);$('r1').onclick=cov;$('r2').onclick=()=>{place();cov()};$('r3').onclick=()=>{save={done:[],j:[],cp:null};persist();location.reload()}}
function place(){const s=save.cp==null?null:ST[save.cp];if(s)pp.set(s.p.x*.62,0,s.p.z*.62);else pp.set(0,0,0)}
const hold=(id,f)=>{const e=$(id);e.onpointerdown=ev=>{ev.preventDefault();f(1)};['onpointerup','onpointerleave','onpointercancel'].forEach(k=>e[k]=()=>f(0))};
/* ---------- panels ---------- */
const PN=[
{h:`<h3>🔥 Exothermic Engine</h3><p>The sealed chamber is the <b>system</b>; the bridge, air and you are the <b>surroundings</b>. Connect a conduit, then ignite: CH₄ + 2O₂ → CO₂ + 2H₂O</p>
<p>Conduit leads to: <button class="b" id="c0a">Bridge (surroundings)</button><button class="b" id="c0b">Back into chamber</button><button class="b" id="c0c">Nowhere (sealed)</button></p><button class="b" id="ig">🔥 Ignite</button>
<p>System (chemical) energy</p><div class="bar"><i id="bs"></i></div><p>Bridge temperature</p><div class="bar"><i id="bw"></i></div><p id="m0"></p><p id="d0"></p>`,
s(){const M={a:'bridge',b:'loop',c:'none'},sel=()=>{for(const j in M)$('c0'+j).classList.toggle('on',M[j]===e0.c)};for(const k in M)$('c0'+k).onclick=()=>{e0.c=M[k];sel();beep(500)};sel();
$('ig').onclick=()=>{if(e0.sys<=60){e0.sys=100;e0.warm=0}
if(e0.c==='bridge'){e0.run=1;H('m0','Reacting… chemical energy flows out through the conduit into the surroundings.');beep(300,.3,'sawtooth')}
else if(e0.c==='loop'){H('m0','The conduit returns the energy to the same chamber, so the bridge stays cold. Energy must reach the <b>surroundings</b>. Try again.');beep(150,.3,'square')}
else H('m0','Sealed chamber: the energy has nowhere to go and just heats the chamber. Connect the conduit to the bridge and ignite again.')}},
u(dt){if(e0.run){e0.flow=1;e0.sys=Math.max(60,e0.sys-dt*10);e0.warm=(100-e0.sys)/40;if(e0.sys<=60){e0.run=0;e0.flow=0;fin(0)}}
W('bs',e0.sys);W('bw',e0.warm*100);if(e0.warm>0)H('d0',`Products end with <b>less energy</b> than the reactants, and the difference went to the surroundings.<br><b>ΔH < 0</b> (exothermic). Methane burning: ΔH = −890 kJ mol⁻¹.${e0.warm>=1?'<br>✔ The bridge is warm and extended — engine restored!':''}`)}},
{h:`<h3>❄ Frozen Canal</h3><p>Ammonium nitrate dissolving <b>absorbs</b> energy: NH₄NO₃(s) → NH₄⁺(aq) + NO₃⁻(aq). The canal water (surroundings) supplies it, so the canal cools. Hold the pump to keep it going.</p>
<button class="b" id="pump" style="width:100%;padding:16px">Hold: pump energy from canal → chamber</button><p>Reaction progress</p><div class="bar"><i id="p1"></i></div><p>Canal temperature</p><div class="bar"><i id="c1" style="background:linear-gradient(90deg,#66ddff,#ff9a4d)"></i></div><p>System energy</p><div class="bar"><i id="s1b"></i></div><p id="m1"></p><p id="d1"></p>`,
s(){hold('pump',v=>e1.hold=v)},
u(dt){if(e1.hold&&e1.prog<100){e1.prog=Math.min(100,e1.prog+dt*12);e1.flow=1}else e1.flow=0;e1.cold=e1.prog/100;
W('p1',e1.prog);W('c1',100-e1.cold*70);W('s1b',30+e1.prog*.4);
H('m1',e1.prog>=100?'✔ Fully dissolved — the canal is frozen solid. Engine restored!':e1.prog>0&&!e1.hold?'You let go, so the process stalled. Endothermic changes only continue while energy keeps being supplied.':'');
if(e1.prog>0)H('d1','Products have <b>more energy</b> than the reactants, taken from the surroundings.<br><b>ΔH > 0</b> (endothermic), about +26 kJ mol⁻¹.');if(e1.prog>=100)fin(1)}},
{h:`<h3>⚗ Bond Workbench</h3><p>H₂ + Cl₂ → 2 HCl. Bond energies (kJ mol⁻¹): <b>H–H 436</b>, <b>Cl–Cl 243</b>, <b>H–Cl 432</b>. Breaking bonds takes in energy; making bonds gives it out.</p>
<p>Energy supplied: <b id="sv">0</b> kJ mol⁻¹<input type="range" id="sl" min="0" max="500" value="0" style="width:100%"></p>
<button class="b" id="s1">Break H–H</button><button class="b" id="s2">Break Cl–Cl</button><button class="b" id="s3">Form H–Cl</button><button class="b" id="s4">Form 2nd H–Cl</button><button class="b" id="rs2">↺ Reset</button><div class="box" id="calc"></div><p id="m2"></p>`,
s(){const sl=$('sl');sl.oninput=()=>H('sv',sl.value);
